<svg xmlns="http://www.w3.org/2000/svg"
     width="512" height="512" viewBox="0 0 512 512">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5FAFF"/>
      <stop offset="100%" stop-color="#DCEBFF"/>
    </linearGradient>

    <linearGradient id="bear" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4388F5"/>
      <stop offset="100%" stop-color="#234DAA"/>
    </linearGradient>

    <linearGradient id="aqua" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6CE2D2"/>
      <stop offset="100%" stop-color="#25BDB8"/>
    </linearGradient>
  </defs>

  <!-- Clean app-icon background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Technology orbit -->
  <path d="M256 75
           A181 181 0 1 1 105 156"
        fill="none"
        stroke="#3475DB"
        stroke-width="23"
        stroke-linecap="round"/>

  <path d="M122 133 A181 181 0 0 1 207 82"
        fill="none"
        stroke="url(#aqua)"
        stroke-width="18"
        stroke-linecap="round"/>

  <circle cx="393" cy="133" r="19" fill="url(#aqua)"/>

  <!-- Bear ears -->
  <circle cx="191" cy="194" r="48" fill="url(#bear)"/>
  <circle cx="321" cy="194" r="48" fill="url(#bear)"/>

  <!-- Inner ears -->
  <circle cx="191" cy="196" r="23" fill="url(#aqua)"/>
  <circle cx="321" cy="196" r="23" fill="url(#aqua)"/>

  <!-- Bear head -->
  <path d="M256 154
           C194 154 155 197 155 258
           C155 320 198 358 256 358
           C314 358 357 320 357 258
           C357 197 318 154 256 154 Z"
        fill="url(#bear)"/>

  <!-- Soft muzzle -->
  <ellipse cx="256" cy="285" rx="67" ry="49" fill="#F7FBFF"/>

  <!-- Eyes -->
  <ellipse cx="218" cy="246" rx="9" ry="12" fill="#FFFFFF"/>
  <ellipse cx="294" cy="246" rx="9" ry="12" fill="#FFFFFF"/>

  <!-- Nose -->
  <path d="M239 273
           Q256 260 273 273
           Q273 288 256 291
           Q239 288 239 273 Z"
        fill="#193A78"/>

  <!-- Small friendly smile -->
  <path d="M256 291 Q246 306 234 298
           M256 291 Q266 306 278 298"
        fill="none"
        stroke="#193A78"
        stroke-width="5"
        stroke-linecap="round"/>

  <!-- Subtle D brand mark -->
  <path d="M246 319 L246 333
           Q262 333 262 321
           Q262 309 246 309"
        fill="none"
        stroke="url(#aqua)"
        stroke-width="6"
        stroke-linecap="round"
        stroke-linejoin="round"/>

</svg>
