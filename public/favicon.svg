<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E8F8FF"/>
      <stop offset="100%" stop-color="#D5F5ED"/>
    </linearGradient>

    <linearGradient id="screen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>

    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#14B8A6"/>
      <stop offset="100%" stop-color="#0EA5E9"/>
    </linearGradient>
  </defs>

  <!-- Soft rounded background -->
  <rect width="512" height="512" rx="118" fill="url(#bg)"/>

  <!-- Computer screen -->
  <rect x="91" y="103" width="330" height="250"
        rx="48" fill="url(#screen)"/>

  <!-- Screen inner surface -->
  <rect x="111" y="123" width="290" height="210"
        rx="32" fill="#FFFFFF"/>

  <!-- Heartbeat / digital pulse -->
  <path d="M137 232
           H190
           L220 232
           L242 180
           L275 282
           L302 215
           L321 232
           H375"
        fill="none"
        stroke="url(#pulse)"
        stroke-width="20"
        stroke-linecap="round"
        stroke-linejoin="round"/>

  <!-- Computer stand -->
  <path d="M231 354 V385
           Q231 397 219 397
           H194
           Q183 397 183 409
           V416
           H329
           V409
           Q329 397 318 397
           H293
           Q281 397 281 385
           V354"
        fill="#3478D4"/>

  <!-- Small creative sparkle -->
  <path d="M389 78
           L400 104
           L426 115
           L400 126
           L389 152
           L378 126
           L352 115
           L378 104 Z"
        fill="#F59E0B"/>

  <!-- Small turquoise accent -->
  <circle cx="113" cy="390" r="15" fill="#14B8A6"/>
</svg>
