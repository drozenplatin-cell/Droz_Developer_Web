<svg xmlns="http://www.w3.org/2000/svg"
     width="512"
     height="512"
     viewBox="0 0 512 512">

  <defs>
    <linearGradient id="surface"
                    x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F5FAFF"/>
      <stop offset="100%" stop-color="#E5F1FF"/>
    </linearGradient>

    <linearGradient id="blue"
                    x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3979E8"/>
      <stop offset="100%" stop-color="#2452B8"/>
    </linearGradient>

    <linearGradient id="aqua"
                    x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#31C8C2"/>
      <stop offset="100%" stop-color="#75E0D2"/>
    </linearGradient>

    <linearGradient id="textGradient"
                    x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#DCEBFF"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512"
        rx="112" fill="url(#surface)"/>

  <!-- Main orbital ring -->
  <path
    d="M256 82
       C353 82 430 159 430 256
       C430 353 353 430 256 430
       C159 430 82 353 82 256
       C82 214 97 175 121 144"
    fill="none"
    stroke="url(#blue)"
    stroke-width="36"
    stroke-linecap="round"/>

  <!-- Orbit accent -->
  <path
    d="M146 115
       C178 91 216 78 256 78"
    fill="none"
    stroke="url(#aqua)"
    stroke-width="23"
    stroke-linecap="round"/>

  <!-- Central pentagon -->
  <path
    d="M256 159
       L338 206
       L338 300
       L256 347
       L174 300
       L174 206 Z"
    fill="url(#blue)"/>

  <!-- Inner pentagon -->
  <path
    d="M256 199
       L303 226
       L303 280
       L256 307
       L209 280
       L209 226 Z"
    fill="#FFFFFF"/>

  <!-- Turquoise center -->
  <path
    d="M256 221
       L287 239
       L287 267
       L256 285
       L225 267
       L225 239 Z"
    fill="url(#aqua)"/>

  <!-- Stylish Droz wordmark -->
  <text
    x="256"
    y="266"
    text-anchor="middle"
    font-family="Arial, Helvetica, sans-serif"
    font-size="43"
    font-weight="800"
    font-style="italic"
    letter-spacing="-2.5"
    fill="#FFFFFF"
    stroke="#2452B8"
    stroke-width="1.2"
    paint-order="stroke fill">droz</text>

  <!-- Orbit point -->
  <circle cx="390" cy="130" r="24"
          fill="#FFFFFF"/>

  <circle cx="390" cy="130" r="15"
          fill="#31C8C2"/>

</svg>
